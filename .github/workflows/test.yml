name: Test
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.lock'
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r requirements.lock --progress-spinner off
      - run: python -m unittest -v
      - run: docker compose --env-file deploy/env.example -f deploy/compose.yaml config --quiet
      - run: docker compose --env-file deploy/env.example -f deploy/compose.yaml run --rm --no-deps caddy caddy adapt --config /etc/caddy/Caddyfile --validate >/dev/null
      - run: docker build --tag canopy:pr .
      - name: Smoke test container runtime
        run: |
          docker run -d --rm --name canopy-smoke -p 127.0.0.1:18082:8080 -e CANOPY_LEGACY_PILOT=1 -e CANOPY_PUBLIC_ORIGIN=https://canopy.example.test -e CANOPY_OPERATOR_TOKEN=ci-only-token-at-least-thirty-two-characters -e MUBIT_API_KEY=ci-placeholder-never-used canopy:pr
          trap 'docker logs canopy-smoke; docker stop canopy-smoke' EXIT
          for ((attempt=1; attempt<=30; attempt++)); do
            if curl --fail --silent http://127.0.0.1:18082/livez; then
              break
            fi
            sleep 1
          done
          curl --fail --silent -H 'Host: canopy.example.test' -u operator:ci-only-token-at-least-thirty-two-characters http://127.0.0.1:18082/readyz
      - name: Smoke test HTTPS Compose deployment
        run: bash scripts/smoke_compose.sh

  hosted-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: canopy
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: canopy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canopy -d canopy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CANOPY_TEST_DATABASE_URL: postgresql://canopy:ci-only-password@localhost:5432/canopy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.lock'
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: python -m unittest -v tests.test_production
      - run: bash scripts/smoke_hosted.sh
